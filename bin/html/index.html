<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产收益追踪系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#6366F1',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        neutral: '#64748B',
                        light: '#F8FAFC',
                        dark: '#1E293B'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="font-inter bg-gray-50 text-dark min-h-screen">
    <header class="bg-gradient-to-r from-white via-white to-blue-50 shadow-sm sticky top-0 z-10">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-primary flex items-center">
                <i class="fa fa-line-chart mr-2"></i>资产收益追踪系统
            </h1>
            <div class="text-sm text-neutral">
                <span id="current-date" class="font-medium"></span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <!-- 第一行：输入区域 + 当前配比 + 资金流动记录 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
            <!-- 资金流动记录（移动到最左侧，并占据两列） -->
            <div
                class="bg-white rounded-xl p-5 card-shadow transition-all duration-300 hover:shadow-lg lg:col-span-2 flex flex-col">
                <h2 class="text-lg font-semibold mb-4 text-dark flex items-center">
                    <i class="fa fa-exchange text-primary mr-2"></i>资金流动记录
                </h2>
                <p class="text-xs text-neutral mb-4">
                    点击理财, 修改理财项目<br>
                    外部资金首先流入到现金, 再从现金到各理财项目<br>
                    输入资金流动信息后需要接着输入当前市值才能获取最新收益情况<br> <span class="text-xs font-medium">正号表示流入, 负号表示流出</span></p>

                <div class="flex-1 flex flex-col justify-between gap-5">
                    <!-- 示意：三枚圆圈放在上方（在独立区域内上下居中） -->
                    <div class="flex-1 min-h-44 flex items-center justify-center">
                        <div class="flex items-center justify-center space-x-14">
                            <div class="text-center">
                                <div
                                    class="w-24 h-24 bg-gradient-to-br from-gray-100 to-gray-50 rounded-full flex items-center justify-center mx-auto">
                                    <span class="text-xl font-medium text-neutral">其他</span>
                                </div>
                            </div>

                            <i class="fa fa-exchange text-primary text-4xl opacity-70"></i>

                            <div class="text-center">
                                <div
                                    class="w-32 h-32 bg-gradient-to-br from-primary/10 to-primary/5 rounded-full flex items-center justify-center mx-auto border border-primary/10">
                                    <span class="text-3xl font-semibold text-primary">现金</span>
                                </div>
                            </div>

                            <i class="fa fa-exchange text-primary text-4xl opacity-70"></i>

                            <div class="text-center">
                                <button id="manage-types-button"
                                    class="w-24 h-24 bg-gradient-to-br from-blue-50 to-blue-100 rounded-full flex items-center justify-center mx-auto hover:from-blue-100 hover:to-blue-200 transition-all duration-300 cursor-pointer border-2 border-blue-300 hover:border-blue-400 shadow-md hover:shadow-lg active:scale-95">
                                    <span class="text-xl font-semibold text-blue-700">理财</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 输入：放在三枚圆圈下方 -->
                    <div class="w-full max-w-4xl mx-auto">
                        <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                            <input type="datetime-local" id="flow-time-input"
                                class="lg:w-52 px-3 py-2 border border-gray-200 rounded-lg input-focus text-sm">
                            <select id="flow-type-select"
                                class="lg:w-40 px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white input-focus">
                                <option>加载中...</option>
                            </select>
                            <input id="flow-value-input" type="number"
                                class="flex-1 min-w-[140px] px-3 py-2 border border-gray-200 rounded-lg input-focus text-sm"
                                placeholder="输入金额">
                            <button id="submit-flow-button"
                                class="w-full lg:w-auto px-6 py-2.5 bg-primary text-white rounded-xl hover:bg-primary/90 transition-all duration-300 shadow-sm">
                                确定
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 当前市值输入（移动到右侧） -->
            <div class="bg-white rounded-xl p-5 card-shadow transition-all duration-300 hover:shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-dark flex items-center">
                    <i class="fa fa-pencil-square-o text-primary mr-2"></i>输入当前市值
                </h2>
                <p class="text-xs text-neutral mb-4">输入框支持加法表达式</p>

                <div class="flex items-center mb-3">
                    <label class="w-20 shrink-0 text-sm font-medium text-neutral">日期</label>
                    <input type="datetime-local" id="worth-time-input"
                        class="flex-1 px-3 py-2 border border-gray-200 rounded-lg input-focus text-sm">
                </div>

                <div id="worth-inputs-container" class="space-y-3">
                    <!-- 市值输入项将动态生成在这里 -->
                </div>

                <button id="submit-worth-button"
                    class="w-full mt-5 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 flex items-center justify-center">
                    <i class="fa fa-paper-plane mr-2"></i>提交
                </button>
            </div>

            <!-- 当前配比（移动到最右侧） -->
            <div class="bg-white rounded-xl p-5 card-shadow transition-all duration-300 hover:shadow-lg">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-dark flex items-center">
                        <i class="fa fa-pie-chart text-primary mr-2"></i>当前配比
                    </h2>
                    <div class="flex items-center">
                        <select id="allocation-type-select"
                            class="px-2 py-1 border border-gray-200 rounded text-sm bg-white input-focus">
                            <option value="worth">现值</option>
                            <option value="principal">本金</option>
                            <option value="profit">利润</option>
                        </select>
                        <button id="draw-allocation-button"
                            class="ml-2 px-3 py-1 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 text-sm">
                            绘制
                        </button>
                    </div>
                </div>

                <div class="h-64 flex flex-col">
                    <div class="flex-1 flex items-center justify-center">
                        <canvas id="allocationChart"></canvas>
                    </div>
                    <div class="flex-none min-h-16 flex items-center justify-center pt-2">
                        <div id="allocation-legend" class="flex flex-wrap justify-center gap-x-5 gap-y-3 text-sm"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 第二行：展示区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- 收益表格 -->
            <div class="bg-white rounded-xl p-5 card-shadow transition-all duration-300 hover:shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-dark flex items-center">
                    <i class="fa fa-table text-primary mr-2"></i>展示收益
                </h2>
                <p class="text-xs text-neutral mb-4">
                    起始计算日：将现值设置为本金的日期，也就是开始算账的起始日期<br>
                    本金变动通过流动信息叠加起始本金动态计算<br>
                    计算本金的截止日期 &lt; 现值日期<br>
                    绘图以现值日期为横刻度
                </p>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4 items-center">
                    <div class="flex items-center">
                        <label class="text-sm mr-2 font-medium text-neutral whitespace-nowrap">起始本金日</label>
                        <input type="date" id="start-date-input" value="2026-01-17"
                            class="flex-1 min-w-0 px-3 py-1.5 border border-gray-200 rounded-lg input-focus text-sm">
                    </div>
                    <div class="flex items-center">
                        <label class="text-sm mr-2 font-medium text-neutral whitespace-nowrap">现值日</label>
                        <input type="date" id="end-date-input" value="2026-01-17"
                            class="flex-1 min-w-0 px-3 py-1.5 border border-gray-200 rounded-lg input-focus text-sm">
                    </div>
                    <div class="flex justify-start md:justify-center">
                        <button id="calculate-profit-button"
                            class="w-full md:w-auto px-10 py-2 bg-primary text-white rounded-xl hover:bg-primary/90 transition-all duration-300 text-sm shadow-sm">
                            计算
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-100">
                                <th class="pb-2 text-left font-medium text-neutral"></th>
                                <th class="pb-2 text-left font-medium text-neutral">本金</th>
                                <th class="pb-2 text-left font-medium text-neutral">现值</th>
                                <th class="pb-2 text-left font-medium text-neutral">收益</th>
                            </tr>
                        </thead>
                        <tbody id="profit-table-body">
                            <tr>
                                <td colspan="4" class="py-2 text-center text-neutral text-sm">
                                    暂无数据，请先选择日期并点击「计算」
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 变化曲线 -->
            <div class="bg-white rounded-xl p-5 card-shadow transition-all duration-300 hover:shadow-lg">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-dark flex items-center">
                        <i class="fa fa-area-chart text-primary mr-2"></i>变化曲线
                    </h2>
                    <div class="flex items-center">
                        <select id="performance-type-select"
                            class="px-2 py-1 border border-gray-200 rounded text-sm bg-white input-focus">
                            <option>加载中...</option>
                        </select>
                        <button id="draw-performance-button"
                            class="ml-2 px-3 py-1 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 text-sm">
                            绘制
                        </button>
                    </div>
                </div>

                <!-- 图表区域：下移一点 + 拉高高度（纵轴更“舒展”） -->
                <div class="h-96 pt-4">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 mt-10 py-6">
        <div class="container mx-auto px-4 text-center text-sm text-neutral">
            <p>© 2026 资产收益追踪系统 | 专业的个人资产管理工具</p>
        </div>
    </footer>

    <!-- 资金类型管理模态框 -->
    <div id="types-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 max-h-[80vh] flex flex-col">
            <!-- 模态框头部 -->
            <div class="flex items-center justify-between p-5 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-dark flex items-center">
                    <i class="fa fa-cog text-primary mr-2"></i>资金类型管理
                </h3>
                <button id="close-types-modal" class="text-neutral hover:text-dark transition-colors">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>

            <!-- 模态框内容 -->
            <div class="flex-1 overflow-y-auto p-5">
                <div id="types-list" class="space-y-3">
                    <!-- 资金类型列表将动态加载到这里 -->
                </div>

                <!-- 新增区域 -->
                <div id="add-type-form" class="mt-4 pt-4 border-t border-gray-200 hidden">
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-neutral mb-1">中文名称</label>
                            <input type="text" id="new-type-cname"
                                class="w-full px-3 py-2 border border-gray-200 rounded-lg input-focus text-sm"
                                placeholder="例如：股票">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-neutral mb-1">英文名称</label>
                            <input type="text" id="new-type-name"
                                class="w-full px-3 py-2 border border-gray-200 rounded-lg input-focus text-sm"
                                placeholder="例如：stock">
                        </div>
                        <div class="flex gap-2">
                            <button id="confirm-add-type"
                                class="flex-1 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 text-sm">
                                确定
                            </button>
                            <button id="cancel-add-type"
                                class="flex-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-all duration-300 text-sm">
                                取消
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 加号按钮 -->
                <div class="mt-4 flex justify-center">
                    <button id="show-add-type-form"
                        class="w-10 h-10 rounded-full bg-primary text-white hover:bg-primary/90 transition-all duration-300 flex items-center justify-center text-xl shadow-sm">
                        <i class="fa fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 模态框底部 -->
            <div class="p-5 border-t border-gray-200">
                <button id="refresh-types-button"
                    class="w-full px-4 py-2.5 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 text-sm font-medium">
                    <i class="fa fa-refresh mr-2"></i>刷新
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="/static/api/api.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
